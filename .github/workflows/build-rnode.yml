name: Build rnode (experimental)

# Temporary workflow to produce a release rnode binary artifact from this branch.
# PR #31's normal CI/test workflows do not upload binaries, so this exists only to
# fetch a current executable without building on the resource-constrained dev machine.

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  build:
    name: Build release rnode
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y protobuf-compiler libprotobuf-dev

      - name: Build rnode (release)
        run: cargo build --locked --release -p rchain-node --bin rnode

      - name: Upload rnode artifact
        uses: actions/upload-artifact@v4
        with:
          name: rnode-x86_64-unknown-linux-gnu
          path: target/release/rnode
          if-no-files-found: error
