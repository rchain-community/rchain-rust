name: Build rnode (temporary)

# Temporary workflow for issue #33: produce a release rnode binary artifact for
# `feat/shard-invoke-remote-deploy` so it can be fetched without building on the
# resource-constrained dev machine. A push to the branch triggers it; it can also
# be run manually. Remove before any dev merge.
#
# Static musl so the binary runs on the local Debian 11 (glibc 2.31) host.

on:
  workflow_dispatch:
  push:
    branches:
      - feat/shard-invoke-remote-deploy

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  build:
    name: Build release rnode (musl static)
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Rust toolchain
        run: |
          rustup show active-toolchain
          rustup target add --toolchain 1.95.0 x86_64-unknown-linux-musl

      - name: Install protobuf compiler and musl linker
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y protobuf-compiler libprotobuf-dev musl-tools

      - name: Build rnode (release, musl)
        run: cargo build --locked --release --target x86_64-unknown-linux-musl -p rchain-node --bin rnode

      - name: Upload rnode artifact
        uses: actions/upload-artifact@v4
        with:
          name: rnode-x86_64-unknown-linux-musl
          path: target/x86_64-unknown-linux-musl/release/rnode
          if-no-files-found: error
