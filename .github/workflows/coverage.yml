# The coverage measurement, on demand.
#
# **What this file used to be.** It triggered on every push to `dev` and `main` and on every pull
# request, and it ran the whole test suite plus three audit gates — so every commit paid for a 45-minute
# job, and the largest of those gates was a 1,453-line linter whose failures all meant "a document
# disagrees with the tree". It is now on demand, for one measurement, and the per-push work lives in
# `ci.yml` where it belongs.
#
# **Why it still exists rather than being deleted.** `nightly.yml` measures coverage on a schedule; this
# measures it when someone asks, which is the case that matters after a change to the test surface — you
# want the number before the next night, not after it. Deleting it would leave `make coverage` as the
# only way to get it, and that needs a local toolchain.
#
# The floors are a regression tripwire, not a target: raise them only *after* measuring.

name: coverage

on:
  workflow_dispatch:

permissions:
  # Least privilege, stated rather than defaulted (AUDIT C137). The default token is read/write in
  # older repositories and the default is not a decision anyone made here.
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    # `llvm-cov` over the whole workspace is the longest thing this repository runs: an unbounded job
    # is one that can hold a runner for hours without anyone being told. 90 minutes is the measured
    # cost plus headroom for a cold cache.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@6db3a280da9eee4283c045c7431ab5116f1a0089 # cargo-llvm-cov

      - name: Install protoc
        run: sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler

      - name: Coverage
        # The line and function floors, and why the second is a *function* floor (AUDIT C107): the
        # audit's item asked for `--branch`, and the toolchain refuses it (`-Z coverage-options=branch`
        # on the pinned 1.95.0), so the closest instrument available is function coverage.
        #
        # `floor = floor(measured) - 2`. That rule was machine-checked by check 11 of
        # `tools/audit-test-register.sh` until 2026-09-27, when the gate was deleted; the rule still
        # describes how these numbers were arrived at, and re-running this job is what reconciles them.
        run: cargo llvm-cov --workspace --all-features --lcov --output-path lcov.info --fail-under-lines 87 --fail-under-functions 80

      - name: Emit the ledger, and refuse a stale commit
        # `spec/COVERAGE-LEDGER.md` is the per-file ranking and the floor, emitted from the lcov this
        # job just produced. A measurement that is not emitted is a number nobody reads.
        #
        # **And a ledger that is emitted but never compared is a number nobody checks** (AUDIT F-17).
        # `tools/emit-coverage-ledger.sh --check` existed and no workflow invoked it: this job only
        # emitted — writing the very file it would have checked — and the nightly job did not emit at
        # all, so the committed ledger could disagree with a real measurement indefinitely with nothing
        # saying so. Comparing the *committed* file against this run's emission is the check that means
        # something, and the remedy is stated rather than implied.
        run: |
          tools/emit-coverage-ledger.sh
          if ! git diff --quiet -- spec/COVERAGE-LEDGER.md; then
            echo "::error::spec/COVERAGE-LEDGER.md is stale — it does not match this measurement. Commit the re-emitted ledger."
            git diff --stat -- spec/COVERAGE-LEDGER.md
            exit 1
          fi

      - name: Upload coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          files: lcov.info
          fail_ci_if_error: false
