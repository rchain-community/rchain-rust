# Test + audit gate + coverage gate.
#
# Runs the full test suite, the type-system audit gate, the coverage-register gate, and
# cargo-llvm-cov with a minimum line-coverage threshold. The threshold is raised only after
# measuring, to two points below the measured value -- never to a number the plan hopes to reach.

name: test & coverage

on:
  push:
    branches: [dev, main]
  pull_request:

jobs:
  test-and-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Type-system audit gate
        run: tools/audit-type-system.sh

      - name: Test-coverage register gate
        # `spec/TEST-COVERAGE.md` must match the tree: no overstated counts, no named test that does
        # not exist, no phantom `#[ignore]` section, and no source file that is neither tested nor
        # an exemption row with a reason class. Hard mode: every check fails the build. (The flag
        # this used to carry — `--deferred-ok` — was dropped when the census sweep closed, so that
        # moment is a visible diff rather than somebody's memory.)
        run: tools/audit-test-register.sh

      - name: Install protoc
        run: sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler

      - name: Coverage
        # llvm-cov executes the complete workspace test suite while collecting coverage, so this
        # is both the test gate and the coverage gate. Keep one test execution path to avoid
        # spending CI time running the same suite twice.
        # The floor is a regression tripwire, not a target: it is raised only *after* measuring, to
        # two points below the measured value, so it can never become a schedule. The number below
        # is no longer remembered here -- the measurement, the per-file ranking and this floor are
        # emitted to `spec/COVERAGE-LEDGER.md` by `tools/emit-coverage-ledger.sh`, and check 11 of
        # `tools/audit-test-register.sh` recomputes `floor = floor(measured) - 2` from the committed
        # lcov, so this line and the ledger cannot drift apart.
        # Measurement history, written without the sign as a record: 73.68 => 71 (Stages 0-2),
        # 79.69 => 77 (Stages 3-4), 81.30 => 79 (the low-coverage sweep), 84.07 => 82 (the census
        # sweep), 86.77 => 84 (the coverage pass: the emitted ledger, and the node's read surface
        # pinned route by route), 87.22 => 85 (the same pass, after its first batches: the
        # `eval_method` arms and refusal tables, the http system process, the gateway carrier),
        # 87.60 => 85 (autopropose, the message variants, the number-channel refusals),
        # 87.95 => 85 (the merge's entry point, the deploy service's delegations),
        # 88.02 => 86 (the export traversal's second level, proposeResult's arms).
        run: cargo llvm-cov --workspace --all-features --lcov --output-path lcov.info --fail-under-lines 86

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          fail_ci_if_error: false
