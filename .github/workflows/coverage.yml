# Test + audit gate + coverage gate.
#
# Runs the full test suite, the type-system audit gate, the coverage-register gate, and
# cargo-llvm-cov with a minimum line-coverage threshold. The threshold is raised only after
# measuring, to two points below the measured value -- never to a number the plan hopes to reach.

name: test & coverage

on:
  push:
    branches: [dev, main]
  pull_request:

jobs:
  test-and-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Type-system audit gate
        run: tools/audit-type-system.sh

      - name: Test-coverage register gate
        # `spec/TEST-COVERAGE.md` must match the tree: no overstated counts, no named test that does
        # not exist, no phantom `#[ignore]` section. `--deferred-ok` tolerates the four gaps the
        # completion plan has not closed yet; drop the flag when the last one closes, so that moment
        # is a visible diff rather than somebody's memory.
        run: tools/audit-test-register.sh --deferred-ok

      - name: Install protoc
        run: sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler

      - name: Coverage
        # llvm-cov executes the complete workspace test suite while collecting coverage, so this
        # is both the test gate and the coverage gate. Keep one test execution path to avoid
        # spending CI time running the same suite twice.
        # The floor is a regression tripwire, not a target: it is raised only *after* measuring, to
        # two points below the measured value, so it can never become a schedule.
        # Measured 79.69% lines (17917/88234 missed) after the coverage-completion plan's Stages
        # 0-4: the legacy-corpus test, the tier sweep, the property sweep for every law with
        # meaningful randomized input, and the input-guard tests. The first measurement was 73.68%
        # (floor 71); this is the second, so the floor is 79.69 - 2 = 77 -- two points below the
        # measurement rather than at it, so ordinary churn does not trip the tripwire.
        run: cargo llvm-cov --workspace --all-features --lcov --output-path lcov.info --fail-under-lines 77

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          fail_ci_if_error: false
