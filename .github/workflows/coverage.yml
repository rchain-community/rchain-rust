# Test + audit gate + coverage gate.
#
# Runs the full test suite, the type-system audit gate, and cargo-llvm-cov with a minimum line-
# coverage threshold. Raise the threshold as coverage improves.

name: test & coverage

on:
  push:
    branches: [dev, main]
  pull_request:

jobs:
  test-and-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Type-system audit gate
        run: tools/audit-type-system.sh

      - name: Install protoc
        run: sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler

      - name: Coverage
        # llvm-cov executes the complete workspace test suite while collecting coverage, so this
        # is both the test gate and the coverage gate. Keep one test execution path to avoid
        # spending CI time running the same suite twice.
        run: cargo llvm-cov --workspace --all-features --lcov --output-path lcov.info --fail-under-lines 50

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          fail_ci_if_error: false
