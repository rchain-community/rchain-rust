[package]
name = "rchain-crypto"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "Faithful and hardened Rust port of the RChain crypto module (Blake2b256, Blake2b512Random, secp256k1, Ed25519, Curve25519)."

[dependencies]
rchain-shared = { path = "../shared" }
blake2 = "0.11"
sha2 = { version = "0.11", features = ["oid"] }
sha3 = "0.12"
k256 = { version = "0.14", features = ["ecdsa", "arithmetic"] }
p256 = { version = "0.14", features = ["ecdsa", "arithmetic", "pem", "pkcs8"] }
x509-cert = { version = "0.3", features = ["builder", "pem"] }
pkcs8 = { version = "0.11", features = ["encryption", "pem"] }
pkcs5 = { version = "0.8", features = ["alloc", "pbes2"] }
ed25519-dalek = { version = "3", features = ["rand_core"] }
crypto_box = "0.9"
# Raw X25519 (RFC 7748) for the OCapN Noise transport's static key. **The box above is not this**: a
# `SalsaBox` is a construction with a nonce and a MAC, and a Noise handshake needs the bare scalar
# multiplication underneath one. BSD-3-Clause, and it pulls `curve25519-dalek` 4.x, which the lock file
# already holds for `crypto_box`.
x25519-dalek = "3"
rand = "0.10"
serde = { version = "1", features = ["derive"] }
# `PrivateKey` zeroes its buffer on drop (AUDIT §12). MIT OR Apache-2.0, already in the lock
# file as a transitive dependency of `k256`/`p256`.
zeroize = "1"

# **wasm32 RNG backends (issue #98).** `getrandom` refuses to compile for `wasm32-unknown-unknown`
# without a JS backend, and it reaches this crate twice through `crypto_box` (0.2) and
# `k256`/`p256`/`rand` (0.4). Naming the crate here with the target feature turns the backend on for
# the transitive copies too (features unify per crate version) while leaving every host build
# untouched. A `custom` backend is not an option: it needs an `unsafe extern` symbol, and the crate
# graph is `#![forbid(unsafe_code)]`. See `.cargo/config.toml` for the matching `getrandom_backend`
# cfg that 0.4 also requires.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom_04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }

# The wasm-target test harness (`tests/wasm_law19.rs`), so Law 19 is pinned on the real target and not
# only on the host. Target-scoped so no host build or other target pulls the runner (issue #98).
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
