[package]
name = "rchain-crypto"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "Faithful Rust port of the RChain crypto module (Blake2b256, Blake2b512Random, secp256k1, Ed25519, Curve25519)."

[dependencies]
rchain-shared = { path = "../shared" }
blake2 = "0.11"
sha2 = { version = "0.11", features = ["oid"] }
sha3 = "0.12"
k256 = { version = "0.14", features = ["ecdsa", "arithmetic"] }
p256 = { version = "0.14", features = ["ecdsa", "arithmetic", "pem", "pkcs8"] }
x509-cert = { version = "0.3", features = ["builder", "pem"] }
pkcs8 = { version = "0.11", features = ["encryption", "pem"] }
pkcs5 = { version = "0.8", features = ["alloc", "pbes2"] }
ed25519-dalek = { version = "3", features = ["rand_core"] }
crypto_box = "0.9"
rand = "0.10"
serde = { version = "1", features = ["derive"] }
