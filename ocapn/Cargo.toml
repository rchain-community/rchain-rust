[package]
name = "rchain-ocapn"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "OCapN for RNode: the object-capability network (CapTP over a pluggable netlayer), so an Agoric vat can hold and invoke an RChain object."

[dependencies]
# Syrup integers are arbitrary precision ("An arbitrary precision signed integer", `Model.md`), so
# a length or a counter in a CapTP message is not bounded by u64. Already in `Cargo.lock` via
# `rchain-models`, which uses the same crate for `g_big_int`.
num-bigint = "0.5"
# Law 19's axiomatized primitives, reused rather than re-implemented: the session identity is
# SHA-256 (KAT-pinned in `rchain-crypto`), and the session's signature scheme will be its Ed25519.
rchain-crypto = { path = "../crypto" }
# The `Par` type, for the bridge's value translation (`par_value.rs`). `models` does not depend on
# `ocapn`, so the edge is acyclic.
rchain-models = { path = "../models" }
rchain-shared = { path = "../shared" }
# The netlayer seam is async because CapTP is, and the node's runtime is tokio (the same choice
# `rchain-comm` made). Minimal features: the netlayer needs `net` + `io-util` + a runtime, the
# tests need `macros`. Features unify per crate workspace-wide, so the node's `full` set carries.
async-trait = "0.1"
tokio = { version = "1", features = ["net", "io-util", "rt", "rt-multi-thread", "macros", "sync"] }
# Fresh per-session Ed25519 seeds for the conformance peer. Already in `Cargo.lock`; the workspace
# draws its OS-seeded randomness through the same `rand::rng()` (see `rchain-crypto`).
rand = "0.10"
# The `noise` netlayer. **`noise-protocol` is the crate Agoric's `rust/ocapn_noise` uses**, so the
# handshake is produced by the same code rather than by a lookalike that has to be argued equivalent —
# which is the whole basis on which this transport can be called interoperable at all.
# `noise-rust-crypto` supplies the X25519 / ChaCha20Poly1305 / Blake2s the reference pins. Both are
# Unlicense, which `deny.toml` already allows.
noise-protocol = "0.2"
noise-rust-crypto = { version = "0.6.2", features = ["x25519", "use-chacha20poly1305", "use-blake2"] }
# The `websocket` netlayer — the transport `@endo/ocapn` 1.1.1 (published) speaks, so it is the one
# there is a live interop target for. MIT / Apache-2.0. The `rustls` half is for `wss://`, which Endo
# does not do but the other reference implementation does; `rustls` and `tokio-rustls` are already in
# the lock file through `rchain-comm`, so this adds the WebSocket layer and nothing below it.
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
# `WebSocketStream` implements `Stream`/`Sink`, and the extension traits that let one be driven are
# here. Already in the lock file through `tonic`; named explicitly because `ocapn` now uses it.
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
# `wss://` on the accepting side. Same version and features `rchain-comm` already builds, so this
# names a dependency the tree has rather than adding one.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
