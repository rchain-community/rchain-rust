name = "rchain-spec"
version = "0.1.0"

# The executables are default targets, and that is load-bearing. A module that is an `lean_exe` root is
# not pulled in by the library target, so `defaultTargets = ["Rchain"]` — which is what this file said
# until 2026-09-23 — made a bare `lake build` compile neither `Rchain/Corpus.lean` (every `decide`d
# conformance verdict) nor `Rchain/LawsMain.lean` (the register's own checks, which only run when the
# module is elaborated). `tools/check-lean-conformance.sh` always built all three; a maintainer following
# `README.md` did not. Building is not running, so this changes nothing about the emitted artefacts.
defaultTargets = ["Rchain", "Rchain.Corpus", "Rchain.LawsMain"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.12.0"

[[lean_lib]]
name = "Rchain"
# Project-wide, and that is the point: with `autoImplicit` on (Lean's default) a *misspelt* identifier
# in a statement is silently bound as an implicit variable, which is how `Comparator`'s universe levels,
# `ParStep.refl`'s `p` and two `SchedulerOnchain` statements got their binders. Turning it off was
# measured before it was believed: three causes, 49 errors, and every module but three was already
# clean (2026-09-23).
[[lean_lib.leanOptions]]
name = "autoImplicit"
value = false

# The conformance corpus emitter: `lake exe rchain-corpus --layer flags --out …`. The corpus is the
# check (see `Rchain/Corpus.lean`) — it is generated from the specification, committed, and consumed
# 1:1 by the Rust tests that `tools/check-lean-conformance.sh` runs.
[[lean_exe]]
name = "rchain-corpus"
root = "Rchain.Corpus"

# The law register: `lake exe rchain-laws --out spec/laws.tsv` (or `--format md`). It emits the catalog
# from `Rchain/Laws.lean` and — because it imports the whole library — *checks* the tree against it:
# numbering, reference integrity, and that the axioms the rows cite are exactly the tree's axioms.
# It is an `lean_exe` root rather than a library module because it imports `Rchain`, which imports
# `Rchain.Laws`; as a root it is excluded from `Rchain.lean`'s import set and cannot be circular.
[[lean_exe]]
name = "rchain-laws"
root = "Rchain.LawsMain"
