name = "rchain-spec"
version = "0.1.0"
defaultTargets = ["Rchain"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.12.0"

[[lean_lib]]
name = "Rchain"

# The conformance corpus emitter: `lake exe rchain-corpus --layer flags --out …`. The corpus is the
# check (see `Rchain/Corpus.lean`) — it is generated from the specification, committed, and consumed
# 1:1 by the Rust tests that `tools/check-lean-conformance.sh` runs.
[[lean_exe]]
name = "rchain-corpus"
root = "Rchain.Corpus"

# The law register: `lake exe rchain-laws --out spec/laws.tsv` (or `--format md`). It emits the catalog
# from `Rchain/Laws.lean` and — because it imports the whole library — *checks* the tree against it:
# numbering, reference integrity, and that the axioms the rows cite are exactly the tree's axioms.
# It is an `lean_exe` root rather than a library module because it imports `Rchain`, which imports
# `Rchain.Laws`; as a root it is excluded from `Rchain.lean`'s import set and cannot be circular.
[[lean_exe]]
name = "rchain-laws"
root = "Rchain.LawsMain"
