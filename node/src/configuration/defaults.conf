# Start a stand-alone node.
# In this mode node
# 1. does not connect to any network
# 2. `casper.genesis-ceremony.ceremony-master-mode` = true
# 3. `required-signatures` = 0
# for node to be able to create and approve genesis block if its not available
standalone = false
autopropose = false
# Propose a block immediately after a deploy is accepted (implies autopropose's deploy trigger, but
# not the continuous timer).
propose-on-deploy = false
# Attest to remote blocks: propose an empty attestation when we have nothing of our own to include, so
# every validator can move its latest message **without `--autopropose`**. On by default; use
# `--no-attest-on-new-blocks` to turn it off. It fires on any remote block, because the fringe rule
# needs attestations to see each other; the proposer's guard bounds the traffic (#70).
attest-on-new-blocks = true
# Do not attest (the opt-out for the above). Effective attestation is
# `attest-on-new-blocks && !no-attest-on-new-blocks`.
no-attest-on-new-blocks = false

protocol-server {
  # ID of the RChain network.
  # Node shall only accept messages with this `network-id`.
  # This is not Casper construct so it is not in `casper` section.
  # This is used to filter out messages originated from different networks to lower down the load.
  network-id = "testnet"

  # Host name or IP address of this node. Will be used by peers to reach this node, so by default have to be public
  # address.
  # If this attribute is not set then node will try to guess its public IP address.
  # Note: actual protocol server is binded to "0.0.0.0"
  # host = localhost

  # Use random ports in case RChain Protocol port and/or Kademlia port are not free.
  use-random-ports = false

  # Support dynamic IP
  dynamic-ip = false

  # Disable UPnP
  no-upnp = false

  # Port for protocol server
  port = 40400

  # Maximum message size that can be received
  grpc-max-recv-message-size = 256K

  # Maximum size of messages that can be received via streams
  # This is effectively max size of a block
  grpc-max-recv-stream-message-size = 256M

  # Number of incoming RChain Protocol message consumers
  # This should be high enough, as BlockMessage consumption can hang waiting for block processing lock and
  # occupy one consumer.
  # The very minimum should be {number of nodes} * {synchrony constraint}, which is enough to consume
  # blocks proposed by peers simultaneously. Taking into account blocks are not the only protocol message,
  # and blocks can be received as well via `requesting missing blocks` routine, it is recommended to
  # make this number high. Upper bounded by the numer of messages (blocks are the biggest of them)
  # node is able to keep in memory. Block size upper bound size is `max-stream-message-size`.
  max-message-consumers = 400

  # whether a node could export the state to other nodes
  disable-state-exporter = false
}

protocol-client {
  # Should be the same as server network ID.
  network-id = ${protocol-server.network-id}

  # Address of RNode to bootstrap from when connecting to a network.
  # This should be provided by bootstrap node operator. You can bootstrap from any network peer.
  # <node-id> is derived from TLS public key used to secure internode communications (see tls.key-path).
  # To manually generate one the following command can be used
  # ```openssl ec -text -in <path-to-tls-key>/node.key.pem | grep pub -A 5 | tail -n +2 | tr -d '\n[:space:]:' | \
  # sed 's/^04//' | keccak-256sum -x -l | tr -d ' -' | tail -c 41```
  bootstrap = "rnode://de6eed5d00cf080fc587eeb412cb31a75fd10358@52.119.8.109?protocol=40400&discovery=40404"

  # Disable the node to start from Last Finalized State, instead it will start from genesis.
  # If this is `true`, when a node without any data connecting to existing network, the node would start from
  # genesis block and validate blocks from scratch. Otherwise, the node would start from last finalized block which
  # can save a lot of time of validating all the history blocks.
  disable-lfs = false

  # Number of connected peers picked randomly for broadcasting and streaming
  batch-max-connections = 20

  # Default timeout for network operations
  network-timeout = 5 seconds

  # Max message size for inbound gRPC messages
  grpc-max-recv-message-size = ${protocol-server.grpc-max-recv-message-size}

  # Chunk size for outbound streamed messages
  grpc-stream-chunk-size = 256K
}

peers-discovery {
  # host name or IP address of this node
  # If this attribute is not set then the node will try to guess its IP address
  # host = localhost

  # Port for Kademlia server
  port = 40404

  # Interval for peers lookup
  lookup-interval = 20 seconds

  # Interval for check for stale connections
  cleanup-interval = 20 minutes

  # Number of connections to check for being active at a time
  # If there are thousands of nodes, we might want to not check all of them each time.
  # One of strategies might be to check all connections with moderately low `check-stale-interval`
  # We implement this by default, so `batch-size` is high
  heartbeat-batch-size = 100

  # Check for first connection loop interval
  init-wait-loop-interval = 1 seconds
}

api-server {
  # Hostname or IP to bind API servers
  host = "0.0.0.0"

  # Port used for external gRPC API, exposes public API endpoints.
  port-grpc-external = 40401

  # Port used for internal gRPC API, exposes propose API and other non public endpoints.
  port-grpc-internal = 40402

  # Maximum size of message that can be received. This is effectively max size of a deploy.
  grpc-max-recv-message-size = 16M

  # Port for HTTP API
  port-http = 40403

  # Port for admin HTTP API
  port-admin-http = 40405

  # Some of API methods are loading blocks into memory, which can lead to memory exhaustion.
  # This puts upper bound on number of blocks that can be loaded via single API call.
  max-blocks-limit = 50

  # Enable reporting API
  enable-reporting = false

  # Serve the cross-shard transaction routes (`/api/v1/txn*`), on the **admin** HTTP server
  # (`port-admin-http`) — not the public one, because the coordinator signs each leg with this node's
  # validator key and spends from that key's own REV account (AUDIT C121). Only a node configured with
  # more than one `casper.shards` membership and a validator key acts as a coordinator; any other
  # node's routes answer 404. Reaching them from another host therefore also needs
  # `enable-devnet-admin-public = true`.
  enable-txn-api = false

  # Relax CORS on the admin HTTP API (devnet / browser-wallet access only)
  enable-devnet-cors = false

  # Publish the admin HTTP API (`/api/propose`) on `host` instead of loopback. That API has no
  # authentication and triggers block production, so the default binds 127.0.0.1 (AUDIT C112);
  # devnet and browser-wallet setups that must reach it from off-host set this true.
  enable-devnet-admin-public = false

  # Sets a custom keepalive time, the delay time for sending next keepalive ping
  keep-alive-time = 2 hours

  # Sets a custom keepalive timeout, the timeout for keepalive ping requests
  keep-alive-timeout = 20 seconds

  # The most aggressive keep-alive time clients are permitted to configure.
  # The server would close the connection if clients exceeding this rate
  permit-keep-alive-time = 5 minutes

  # Sets a custom max connection idle time, connection being idle for longer than which will be gracefully terminated
  max-connection-idle = 1 hours

  # Sets a custom max connection age, connection lasting longer than which will be gracefully terminated
  max-connection-age = 1 hours

  # Sets a custom grace time for the graceful connection termination. Once the max connection age
  # is reached, RPCs have the grace time to complete. RPCs that do not complete in time will be
  # cancelled, allowing the connection to terminate
  max-connection-age-grace = 1 hours

  # Bind an OCapN listener on this `host:port`, e.g. "127.0.0.1:22045". Off when unset.
  #
  # OCapN is the object-capability network an Agoric vat speaks (issue #249). The only netlayer
  # implemented here is the OCapN project's `tcp-testing-only`: plain TCP, no encryption and no
  # authentication. It exists to be interoperated with and tested, NOT to be published.
  #
  # **What binding this publishes, beyond the transport** (the HAZOP at
  # `spec/audit/evidence/ocapn-hazop.md` measured each of these): any peer that reaches the address
  # can complete an unauthenticated handshake, and — when `dev.deployer-private-key` is also set —
  # make this node **submit deploys signed with that key**, which the chain records as *the node's*
  # action: it spends the node's REV, writes permanent registry entries, and reaches every arm that
  # trusts `rho:rchain:deployerId`. A peer may also make the node **dial any host:port it names**
  # (sturdyrefs and handoff gives carry peer-chosen locations). Leave this unset unless every peer
  # that can reach the address is trusted; bind loopback (`127.0.0.1:…`) unless the interop needs
  # otherwise.
  # ocapn-listen = ""

  # Bind the **`unix`** OCapN listener at this socket path (issue #249), or leave it unset for none.
  # Unlike `ocapn-listen`, this transport **authenticates**: the socket is created mode `0600`, so
  # only this uid can connect, and what admitted a peer is the filesystem's permission rather than a
  # network address. Still an opt-in, for the same reason as `ocapn-listen` — a peer that reaches the
  # socket can complete a handshake and, when `dev.deployer-private-key` is set, make this node submit
  # deploys signed with that key. The path must be on a filesystem only this node's uid can traverse.
  # ocapn-listen-unix = ""

  # Refuse to dial **loopback and private addresses** on a peer's word. A sturdyref and a handoff give
  # both carry a peer-chosen address the receiving node then connects to, so with this off a peer can
  # aim the node at its own LAN (HAZOP row B4). Off by default because a loopback peer is how the
  # OCapN conformance suite and the ERTP transcript run; turn it on for a listener that serves peers
  # which are not on this host. **Link-local (169.254.0.0/16, fe80::/10) and the unspecified address
  # are refused whatever this says** — they are never a legitimate peer, and the first is the cloud
  # metadata endpoint. A *hostname* is resolved and what it resolves to is judged, so a name pointing
  # into a denied range is refused (AUDIT C225).
  ocapn-deny-local-dial = false
}

storage {
  # Path to data directory. Depends on CLI `profile` option.
  data-dir = ${default-data-dir}
}

tls {
  # "Path to X.509 certificate for TLS. If file does not exist, certificate will be
  # generated from PEM key located at `tls.key-path`.
  certificate-path = ${storage.data-dir}/node.certificate.pem

  # Path to private key for TLS. Elliptic curve secp256r1 key in PEM format is supported.
  # If file does not exist, new key will be generated.
  key-path = ${storage.data-dir}/node.key.pem

  # Use a non blocking secure random instance to generate TLS key
  secure-random-non-blocking = false

  # TODO possibly remove
  custom-certificate-location = false
  custom-key-location = false
}

casper {
  # Base16 encoding of the public key to use for signing a proposed blocks.
  # Can be inferred from the private key for some signature algorithms.
  # validator-public-key =

  # Base16 encoding of the private key to use for signing a proposed blocks.
  # It is not recommended to use in production since private key could be revealed through the process table.
  # validator-private-key =

  # Path to the private key to use for signing a proposed blocks.
  # Preferred over `validator-private-key` above: it keeps the secret out of the process
  # argument list, where `ps`/`/proc` would expose it. The file may hold a base16 scalar
  # or an unencrypted PKCS#8 PEM key. Ignored if `validator-private-key` is set.
  # validator-private-key-path =

  # Shard name written into PoS contract during genesis.
  shard-name = root,

  # ID of the parent shard. For root shard it's `/`. ID of the shard is `{parent-shard-id}/{shard-name}`.
  # So for root named `root` shard ID is `/root`, for its child shard `rootchild` shard ID is `/root/rootchild`.
  parent-shard-id = /

  # The shards this node is a member of (a "gateway" node is a member of several). Each entry is an
  # object with `shard-name` and `parent-shard-id`, and may override any field of this node-level
  # `genesis-block-data` / `autogen-shard-size` (unset fields fall back to it). The FIRST entry is
  # the primary shard — the default target for requests that do not name a shard — and gets the data
  # directory above; every later membership gets `<data-dir>/shard/<shard-id segments>/`.
  # Unset, the `shard-name`/`parent-shard-id` above define a one-element list (an ordinary
  # single-shard node). Setting both this and those two scalar keys is an error.
  # File-configured only: the command line cannot address array entries, so per-shard
  # `genesis-block-data` (bonds/wallets) is expressed here rather than through flags.
  # shards = [
  #   { shard-name = root, parent-shard-id = / }
  #   { shard-name = child, parent-shard-id = /root,
  #     genesis-block-data {
  #       genesis-data-dir = /var/lib/rnode/genesis-child
  #       bonds-file = /var/lib/rnode/genesis-child/bonds.txt
  #       wallets-file = /var/lib/rnode/genesis-child/wallets.txt
  #       bond-minimum = 1
  #       bond-maximum = 9223372036854775807
  #       epoch-length = 10000
  #       quarantine-length = 50000
  #       genesis-block-number = 0
  #       number-of-active-validators = 100

    # **The block producer's share of a deploy's burned phlo, in basis points** (B2, #150): 2500 pays
    # the validator that signed a block a quarter of the fees that block consumed, out of the staking
    # vault, before the rest of the epoch's burned phlo is split across the drawn active set. It is a
    # reallocation inside a fixed pie, not a new emission: the pie is what was burned. 0 is the
    # contract's own behaviour (`Pos.rhox` pays producers nothing beyond their share of the pot), and
    # it is what a params record written before this key existed decodes to.
    executor-share = 2500

    # **How long a bonded validator may go without signing a block before an epoch stops paying it**
    # (B4, #150), in heights. 0 — the shipped default — is the contract's behaviour: absence costs
    # nothing, and an absent validator is paid for being drawn. A positive value arms an income-only
    # rule: at an epoch boundary a drawn validator whose last signed block is older than this many
    # heights *forfeits that epoch's reward*, which stays in the vault for a later epoch. It can never
    # touch a bond, it is not a slash, and one block from the validator restores it in full.
    absence-slack = 0

    # **How far behind the last finalised fringe a validator's latest message may sit and still be paid
    # its whole share** (B4, #150), in heights — the flat part of the participation weight, with the ramp
    # running from here to `absence-slack`. `absence-slack = 0` disables the rule whatever this says.
    #
    # **Deliberately not given a value here, and that is the point.** This file is merged *under* every
    # config, so a value in it would resolve for a network that omits the key — and the key's fallback is
    # `absence-slack`, because a config that predates the weight describes a chain running the *binary*
    # rule (`grace == slack`). A value here would silently turn every armed chain into a ramped one: a
    # rule change wearing a default. State it explicitly to grade.
    # participation-grace = 0
  #       pos-multi-sig-public-keys = []
  #       pos-multi-sig-quorum = 0
  #       pos-vault-pub-key = ""
  #       system-contract-pub-key = ""
  #     } }
  # ]

  # Interval of the casper loop to maintain requested blocks and missing dependent blocks
  # in the node runtime, there is a loop which would fetch dependency of the missing dag and maintain
  # requested blocks. See
  # https://github.com/rchain/rchain/blob/43a1dfd90ec16a4a5c3b24e7d7aab8bc160ccb2b/node/src/main/scala/coop/rchain/node/NodeRuntime.scala#L746-L759
  casper-loop-interval = 30 seconds

  # Timeout for the requested blocks
  # all requests sent to request blocks is put into a data structure for maintain.
  requested-blocks-timeout = 240 seconds

  # Maximum number of block parents — a **consensus bound since #153**, enforced on both sides.
  #
  # It was `2147483647` and consulted by nothing: no proposer cap, no validation rule, while two doc
  # comments and C123's fix rationale asserted it bounded a block's justification set. A proposer that
  # ignored it handed every validator an arbitrarily wide merge, and the merge is the one block input a
  # proposer chooses outright.
  #
  # 255 is the protocol's existing per-block width — the `u8` seed index that `MAX_BLOCK_DEPLOYS` already
  # occupies — so the two per-block inputs share one bound rather than inventing a second. It is also
  # 2.55x the shipped `number-of-active-validators` (100), so it does not bind any set a bonded network
  # can legitimately produce: the parent set is the round snapshot, one message per sender.
  #
  # Refusing a wider set rejects blocks that were valid before, so it is a hard-fork-class change,
  # registered in `spec/audit/passes.md` section 6 and tracked on #51 section A. `0` or a negative value
  # disables the check, which is how a chain keeps the pre-#153 semantics exactly.
  max-number-of-parents = 255

  # Node will request for fork choice tips if the latest FCT is more then this value.
  fork-choice-stale-threshold = 10 minutes

  # Interval for check if fork choice tip is stale
  fork-choice-check-if-stale-interval = 11 minutes

  # Each block in Casper is justified by number of other blocks.
  # Before creating new block node checks if sum stake behind blocks in justificaton
  # is more then `synchrony-constraint-threshold` * {total stake of all other validators in a shard}.
  synchrony-constraint-threshold = 0.67

  # Node is allowed to propose a block only when last finalised block is less then `height-constraint-threshold`
  # behind. This is experimental option.
  height-constraint-threshold = 1000

  # Genesis block variables
  genesis-block-data {
    genesis-data-dir = ${storage.data-dir}/genesis

    # Plain text file consisting of lines of the form `<pk> <stake>`,
    # which defines the bond amounts for each validator at genesis.
    # <pk> is the public key (in base-16 encoding) identifying the validator and <stake>
    # is the amount of Rev they have bonded (an integer).
    bonds-file = ${casper.genesis-block-data.genesis-data-dir}/bonds.txt

    # Plain text file consisting of lines of the form `<algorithm> <pk> <revBalance>`,
    # which defines the Rev wallets that exist at genesis.
    # <algorithm> is the algorithm used to verify signatures when using the wallet (one of ed25519 or secp256k1),
    # <pk> is the public key (in base-16 encoding) identifying the wallet and <revBalance>
    # is the amount of Rev in the wallet.
    wallets-file = ${casper.genesis-block-data.genesis-data-dir}/wallets.txt

    # Minimum bond accepted by the PoS contract in the genesis block.
    bond-minimum = 1

    # Maximum bond accepted by the PoS contract in the genesis block.
    bond-maximum = 9223372036854775807

    # Length of the validation epoch measured in blocks.
    # This is put into PoS contract in the genesis block.
    epoch-length = 10000

    # Length of the quarantine time measured in blocks.
    # This is put into PoS contract in the genesis block.
    quarantine-length = 50000

    # Max number of active validator in a shard. Validator rotation will be enabled if there are
    # extra bond requests then slots available.
    number-of-active-validators = 100

    # genesis-block-number is used for hard fork on existing network.
    genesis-block-number = 0

    # Public keys accepted by the PoS contract in the genesis block.
    pos-multi-sig-public-keys = [
      "04db91a53a2b72fcdcb201031772da86edad1e4979eb6742928d27731b1771e0bc40c9e9c9fa6554bdec041a87cee423d6f2e09e9dfb408b78e85a4aa611aad20c",
      "042a736b30fffcc7d5a58bb9416f7e46180818c82b15542d0a7819d1a437aa7f4b6940c50db73a67bfc5f5ec5b5fa555d24ef8339b03edaa09c096de4ded6eae14",
      "047f0f0f5bbe1d6d1a8dac4d88a3957851940f39a57cd89d55fe25b536ab67e6d76fd3f365c83e5bfe11fe7117e549b1ae3dd39bfc867d1c725a4177692c4e7754"
    ]

    # How many confirmations are necessary to use multi-sig vault.
    # The value should be less or equal the number of PoS multi-sig public keys.
    pos-multi-sig-quorum = 2

    # Public key for transfers from the PoS vault
    # This public key is used to make transfer from PoS vault defined in PoS contract
    pos-vault-pub-key = ""

    # Public key to manage updates of system contracts.
    # It should be set when network is started (genesis block is created).
    # Not setting this key will disable possibility to update system contracts.
    system-contract-pub-key = ""
  }

  # If node has to create genesis block but no bonds file is provided, bonds file with a list of
  # random public keys is generated + private keys corresponding to that keys are stored
  # in `<genesis-path>/<public_key>.sk`
  # This param specifies number of validator identites to generate.
  autogen-shard-size = 5

  # The minimum Phlogiston price. Value can be configured to provide sufficient transaction fees to cover
  # the cost of the network and equipment
  min-phlo-price = 1

  # **Broadcast a twin of every block this node creates** — the same block with a different timestamp,
  # equally signed. Off, and it must stay off outside a measurement: on a real network the node is
  # recording itself as having equivocated, and it is its own bond the peers will take for it (AUDIT
  # C200). It exists so the equivocation rules can be exercised between two *live* nodes, which is the
  # one thing a single-process test cannot do.
  equivocation-injection = false

  # The effect scheduler (Laws 20-25): dfs | gate | relaxed | relaxed-validated.
  # `relaxed` is off-chain only: a relaxed node refuses block-path deploy execution
  # (explore-deploy still runs relaxed). `relaxed-validated` (Laws 23-25) runs the relaxed
  # scheduler on the block path with sequential-reference validation and sequential fallback.
  effect-scheduler = dfs
}

# Kamon's reporter switches, kept so a Scala-shaped config still parses — the row that records what
# this port does with them is spec/audit/passes.md §6 (the metrics reporters are refused at startup, and
# `prometheus` is accepted with a note).
#
# Kamon is not part of this port: `GET /metrics` serves Prometheus text and is always on, there is no
# InfluxDB or UDP sender, no Zipkin span reporter and no Sigar collector. So `Configuration::build`
# **refuses** a `run` that sets influxdb, influxdb-udp, zipkin or sigar — an error at startup naming
# the reporter, rather than a setting accepted and ignored — and prints one note when
# `prometheus = true` saying the endpoint is already on and is not gated by this key. A `false` value
# is the default here, not an ask.
metrics {
  # The endpoint exists here (`GET /metrics`, Prometheus text) and is always on: `true` prints a note
  # saying so, and `false` does not disable it.
  prometheus = false
  # No InfluxDB sender in this port: `true` is refused at startup.
  influxdb = false
  # The oracle's custom kamon-influxdb reporter sends over UDP with millisecond precision, because the
  # default HTTP reporter's epoch-second timestamps overwrite each other. This port has no UDP sender
  # either: `true` is refused at startup.
  influxdb-udp = false
  # No Zipkin span reporter in this port: `true` is refused at startup.
  zipkin = false
  # No Sigar host-metrics collector in this port: `true` is refused at startup.
  sigar = false
}

dev-mode = false

dev {
  # If set, on each propose node will add dummy deploy signed by this key.
  # deployer-private-key =
}
