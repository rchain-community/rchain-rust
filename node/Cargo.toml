[package]
name = "rchain-node"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "Faithful Rust port of the RChain node module (glue: configuration, runtime, API)."

[dependencies]
async-trait = "0.1"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
hocon = { version = "0.9", default-features = false }
linked-hash-map = "0.5"
prost = "0.14"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rustyline = { version = "18", features = ["derive"] }
rchain-block-storage = { path = "../block-storage" }
rchain-casper = { path = "../casper" }
rchain-comm = { path = "../comm" }
rchain-crypto = { path = "../crypto" }
rchain-models = { path = "../models" }
rchain-rholang = { path = "../rholang" }
rchain-rspace = { path = "../rspace" }
rchain-sdk = { path = "../sdk" }
rchain-shared = { path = "../shared" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tonic = { version = "0.14", features = ["transport"] }
tower = { version = "0.5", features = ["timeout"] }
tower-http = { version = "0.6", features = ["cors", "timeout"] }

[dev-dependencies]

[[bin]]
name = "rnode"
path = "src/main.rs"
