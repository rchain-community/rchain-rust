[package]
name = "rchain-node"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "Faithful and hardened Rust port of the RChain node module (glue: configuration, runtime, API)."

[dependencies]
async-trait = "0.1"
axum = "0.8"
# `string` is what lets `version = …` take the *computed* version string: clap's `Str` is a
# `&'static str` by default, and the provenance commit is not known until the build script runs
# (issue #32). Without it the only routes are leaking a `String` or leaving `--version` reporting a
# bare version number while `/version` reports the commit.
clap = { version = "4", features = ["derive", "string"] }
futures-util = "0.3"
hocon = { version = "0.9", default-features = false }
linked-hash-map = "0.5"
prost = "0.14"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rustyline = { version = "18", features = ["derive"] }
rchain-block-storage = { path = "../block-storage" }
rchain-casper = { path = "../casper" }
rchain-comm = { path = "../comm" }
rchain-crypto = { path = "../crypto" }
rchain-models = { path = "../models" }
rchain-rholang = { path = "../rholang" }
rchain-rspace = { path = "../rspace" }
rchain-sdk = { path = "../sdk" }
rchain-shared = { path = "../shared" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tonic = { version = "0.14", features = ["transport"] }
tower = { version = "0.5", features = ["timeout"] }
tower-http = { version = "0.6", features = ["cors", "timeout"] }
# Heap profiling (#117), off by default. The allocator and the profiler are wired in `src/main.rs`
# only — the *bin*, not the lib — so `cargo test --all-features` (which `make test-*` uses) compiles
# the dependency without installing a profiling global allocator in any test harness.
dhat = { version = "0.3", optional = true }

[features]
dhat-heap = ["dep:dhat"]

[dev-dependencies]

[[bin]]
name = "rnode"
path = "src/main.rs"
