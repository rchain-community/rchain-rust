[package]
name = "rchain-sdk"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "Faithful Rust port of the RChain sdk module (consensus stake + DAG merge conflict resolution)."

[dependencies]
rchain-shared = { path = "../shared", default-features = false }

[dev-dependencies]
# The property sweep (Laws 14/17). Already in `Cargo.lock` — a dev-dependency addition, not a new
# external dependency.
proptest = "1"
