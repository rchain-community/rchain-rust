// Vendored, scalapb-stripped copy of models/src/main/protobuf/CasperMessage.proto.
// Field numbers and types are unchanged; only scalapb options/imports are removed.
// `PCost` (normally from RhoTypes.proto) is inlined so this file is self-contained.

syntax = "proto3";

package casper;

// ---------- Approved block ---------

// The fringe state a **restoring** node cannot derive from the blocks (#139). `fringe` and
// `fringeStateHash` are a node's own recomputation produced by validation — they are not block
// fields, and the block hash covers the block, so they cannot ride on it. A joiner that LFS-syncs a
// mature chain therefore had no way to learn them and could not replay what it restored; this
// carries them, per block, alongside the fringe they belong to.
message BlockFringeProto {
  bytes blockHash       = 1;
  repeated bytes fringe = 2;
  bytes fringeStateHash = 3;
}

message FinalizedFringeProto {
  repeated bytes hashes = 1;
  bytes stateHash       = 2;
  // One entry per block in this fringe's ancestry, present only when the requester asked for it
  // (`includeFringeMetadata`). An older responder simply leaves it empty and an older requester
  // never sees it — a field, not a new message type, so neither side errors on the other.
  repeated BlockFringeProto ancestry = 3;
}

message FinalizedFringeRequestProto {
  string identifier = 1;
  bool   trimState  = 2;
  // Ask the responder to fill `ancestry`. Ignored by a responder that does not know the field, which
  // is what makes this a non-breaking addition: a mixed pair degrades to the pre-#139 behaviour
  // instead of failing to sync.
  bool   includeFringeMetadata = 3;
}

// ------- End Approved block --------

message ForkChoiceTipRequestProto {
}

message HasBlockRequestProto {
  bytes hash = 1;
}

message HasBlockProto {
  bytes hash = 1;
}

message BlockRequestProto {
  bytes hash = 1;
}

message BlockHashMessageProto {
  bytes hash         = 1;
  bytes blockCreator = 2;
}

// --------- Core Protocol  --------

message BlockMessageProto {
  int32  version        = 1;
  string shardId        = 2;
  bytes  blockHash      = 3;
  int64  blockNumber    = 4;
  bytes  sender         = 5;
  int64  seqNum         = 6;
  bytes  preStateHash   = 7;
  bytes  postStateHash  = 8;
  repeated bytes justifications = 9;
  repeated BondProto bonds      = 10;
  repeated bytes rejectedDeploys    = 11;
  repeated bytes rejectedBlocks     = 12;
  repeated bytes rejectedSenders    = 13;
  RholangStateProto state          = 14;
  string sigAlgorithm   = 15;
  bytes  sig            = 16;
  // Proposer's wall clock (ms since the Unix epoch) at block creation. Informational only: it is
  // NOT a consensus input (validators ignore it), and it is exposed to RChain applications via
  // `rho:block:data`. It is part of the header, so it is covered by the block hash.
  int64  timestamp      = 17;
}

message DeployDataProto {
  bytes  deployer              = 1;
  string term                  = 2;
  int64  timestamp             = 3;
  bytes  sig                   = 4;
  string sigAlgorithm          = 5;
  int64  phloPrice             = 7;
  int64  phloLimit             = 8;
  int64  validAfterBlockNumber = 10;
  string shardId               = 11;
  // Binary attachments (RCHIP #39). Signed as part of the deploy data; referenced from rholang as
  // `rho:attachment:1`, `rho:attachment:2`, … (1-based) yielding a ByteArray. Deploys without
  // attachments encode exactly as before, so existing signatures/ids are unchanged.
  repeated bytes attachments  = 12;
}

// Inlined from RhoTypes.proto.
message PCost {
  uint64 cost = 1;
}

message RholangStateProto {
  repeated ProcessedDeployProto       deploys       = 1;
  repeated ProcessedSystemDeployProto systemDeploys = 2;
}

message ProcessedDeployProto {
  DeployDataProto deploy        = 1;
  PCost cost                    = 2;
  repeated EventProto deployLog = 3;
  bool errored                  = 4;
  string systemDeployError      = 5;
}

message SlashSystemDeployDataProto {
  bytes slashedValidator = 1;
  // **How much of the victim's holding this slash takes** (AUDIT C199): 0 = a slash recorded before
  // the tiers existed, which takes all of it; 1 = malicious, 2 = a misdemeanour, 3 = an honest
  // mistake. It is in the *state* rather than in the node's metadata because a replayer reconstructs
  // the system deploy from here and has no DAG to re-derive a tier from — and because a receiving
  // node has to be able to check it against its own derivation rather than take the proposer's word.
  int32 slashSeverity = 2;
  // **Equivocation evidence** (AUDIT C200): the offender's *second* block at a `(sender, seqNum)` the
  // DAG already holds a different block for, reduced to its header and serialized
  // (`EquivocationEvidenceProto`). Carried as bytes rather than as a nested `BlockMessage` because a
  // block that contains it would otherwise be a recursive proto; decoded and verified by every
  // receiver against its own DAG. Empty means the slash is justified the other way — by the offender's
  // failed block sitting in the slashing block's justifications.
  bytes equivocationEvidence = 3;
}

// **The minimal proof of an equivocation** (AUDIT C200) — the offender's second block, reduced to the
// fields that make the offence checkable by someone who never saw it.
//
// It is a block *header* and not a block, and the reason is the payload's destination: this rides in
// the slashing block's own state, which is consensus data every node stores and every replayer reads.
// A whole block is bounded by nothing a peer must respect (a refused block has passed no check at
// all), so carrying one would let any peer plant an arbitrarily large object in consensus state by
// signing two blocks at one sequence number. Every field here is fixed-width, so the payload is a few
// hundred bytes whatever the offender does.
//
// What a receiver checks with it: that `sender` signed `blockHash` (`sig` over `sigAlgorithm`), and
// that **its own DAG** already holds a *different* block by that sender at `seqNum`. The second half
// is why the payload needs no copy of the first block, and why a proposer cannot forge the offence —
// it would have to make two signatures by the victim.
message EquivocationEvidenceProto {
  bytes blockHash      = 1;  // the conflicting block's content-addressed hash
  bytes sender         = 2;  // the offender: the 65-byte uncompressed public key that signed it
  sint64 seqNum        = 3;  // the sequence number both of the offender's blocks claim
  bytes sig            = 4;  // the offender's signature over `blockHash`
  string sigAlgorithm  = 5;  // that signature's algorithm
}

message CloseBlockSystemDeployDataProto {
}

// **The block says who produced it** (B4, #150), so that the chain has a per-validator *activity*
// record at all.
//
// The message is deliberately **empty**, and that is the property that makes the record
// unsteerable: the speaker and the height are the block's own `sender` and `block_number`, read from
// the block being processed by every node, so a proposer cannot write another validator's entry and
// cannot claim a height that is not its own. What the presence of this deploy records is that the
// block's producer spoke at the block's own height — nothing a proposer can choose.
message RecordSpokeSystemDeployDataProto {
}

message SystemDeployDataProto {
  oneof systemDeploy {
    SlashSystemDeployDataProto slashSystemDeploy = 1;
    CloseBlockSystemDeployDataProto closeBlockSystemDeploy = 2;
    RecordSpokeSystemDeployDataProto recordSpokeSystemDeploy = 3;
  }
}

message ProcessedSystemDeployProto {
  SystemDeployDataProto systemDeploy = 1;
  repeated EventProto deployLog      = 2;
  string errorMsg                    = 3;
}

message RejectedDeployProto {
  bytes sig = 1;
}

message EventProto {
  oneof event_instance {
    ProduceEventProto produce = 1;
    ConsumeEventProto consume = 2;
    CommEventProto comm       = 3;
  }
}

message ProduceEventProto {
  bytes channelsHash  = 1;
  bytes hash          = 2;
  bool  persistent    = 3;
  int32 timesRepeated = 4;
}

message ConsumeEventProto {
  repeated bytes channelsHashes = 1;
  bytes hash                    = 2;
  bool  persistent              = 3;
}

message CommEventProto {
  ConsumeEventProto consume          = 1;
  repeated ProduceEventProto produces = 2;
  repeated PeekProto peeks           = 3;
}

message PeekProto {
  int32 channelIndex = 1;
}

message BondProto {
  bytes validator = 1;
  int64 stake     = 2;
}

// --------- End Core Protocol  --------

// --------- Last finalized state  --------

message StoreNodeKeyProto {
  bytes hash  = 1;
  int32 index = 2;
}

message StoreItemsMessageRequestProto {
  repeated StoreNodeKeyProto startPath = 1;
  int32 skip = 2;
  int32 take = 3;
}

message StoreItemProto {
  bytes key   = 1;
  bytes value = 2;
}

message StoreItemsMessageProto {
  repeated StoreNodeKeyProto startPath    = 1;
  repeated StoreNodeKeyProto lastPath     = 2;
  repeated StoreItemProto historyItems    = 3;
  repeated StoreItemProto dataItems       = 4;
}

// --------- End Last finalized state  --------

// --------- Internal types ---------

message BlockMetadataProto {
  bytes blockHash               = 1;
  int64 blockNum                = 2;
  bytes sender                  = 3;
  int64 seqNum                  = 4;
  repeated bytes justifications = 5;
  repeated BondProto bonds      = 6;
  bool validated                = 20;
  bool validationFailed         = 21;
  bool slashable                = 22;
  // Why the block failed, so a restoring rule can be keyed on the reason rather than on the bare
  // flag (AUDIT C173): 0 = none, 1 = attributable to the block, 2 = this node's view diverged,
  // 3 = refused because a justification failed. Kept as an int32 because this proto has no enums.
  int32 failureCause            = 23;
  // How many times this node has tried to restore the record. Persisted so the attempt cap in
  // `restore_divergent_justifications` survives a restart.
  uint32 restoreAttempts        = 24;
  // How much of what the sender holds a slash for this failure may take (AUDIT C199): 0 = a record
  // written before the tiers existed, which slashes in full; 1 = malicious (all of it), 2 = a
  // misdemeanour (a quarter), 3 = an honest mistake (a tenth). Node-local, like `slashable` beside it
  // — the *tier* travels to the slash through the block's own system deploy, not through here.
  int32 slashSeverity           = 25;
  repeated bytes fringe         = 30;
  bytes fringeStateHash         = 31;
  bytes memberOfFringe          = 40;
}

message FringeDataProto {
  bytes fringeHash               = 1;
  repeated bytes fringe          = 2;
  repeated bytes fringeDiff      = 3;
  bytes stateHash                = 4;
  repeated bytes rejectedDeploys = 10;
  repeated bytes rejectedBlocks  = 11;
  repeated bytes rejectedSenders = 12;
}

// --------- End Internal types ---------
