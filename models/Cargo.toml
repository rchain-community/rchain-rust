[package]
name = "rchain-models"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "Faithful Rust port of the RChain models module (rholang AST + canonicalizing sorter)."

[dependencies]
num-bigint = { version = "0.5", features = ["serde"] }
num-traits = "0.2"
prost = "0.14"
serde = { version = "1", features = ["derive"] }
tonic = "0.14"
rchain-crypto = { path = "../crypto" }
rchain-shared = { path = "../shared" }

[build-dependencies]
prost-build = "0.14"
tonic-build = "0.14"

[dev-dependencies]
serde_json = "1"
